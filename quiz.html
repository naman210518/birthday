<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Check 💀</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5d9e8;color:#241326;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:22px;overflow-x:hidden}.blob{position:fixed;width:230px;height:230px;border-radius:50%;filter:blur(2px);opacity:.5}.b1{background:#ff87ba;top:-80px;left:-70px}.b2{background:#8d72ff;right:-90px;bottom:-90px}.paper{width:min(560px,100%);background:#fffaf5;border-radius:26px;padding:32px 22px;box-shadow:0 25px 60px #6c31562b;transform:rotate(-.6deg);position:relative}.tape{position:absolute;width:90px;height:25px;background:#f2c878aa;top:-10px;left:calc(50% - 45px);transform:rotate(2deg)}.stamp{display:inline-block;border:2px dashed #8b3e70;padding:7px 10px;border-radius:10px;font-size:11px;font-weight:900;letter-spacing:1px}.paper h1{font-size:30px;margin:20px 0 10px}.question{font-size:18px;line-height:1.55;margin:20px 0}.input{width:100%;padding:15px 16px;border:2px solid #ead0df;border-radius:14px;font-size:16px;outline:none;background:white}.input:focus{border-color:#a95b8e}.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:#6d3b66;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.msg{min-height:55px;margin-top:15px;padding:12px;border-radius:12px;background:#f9eaf2;font-weight:700;line-height:1.45}.progress{margin-top:18px;font-size:12px;color:#8a7182;text-align:center}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}.wrong{animation:shake .35s}
</style></head><body><div class="blob b1"></div><div class="blob b2"></div><main class="paper" id="paper"><div class="tape"></div><span class="stamp">CAPTAIN SECURITY CHECK 🔐</span><h1>Agr tujhe tera bday surprise dekhna h... 👀</h1><div class="question"><b>Question 🤔</b><br><br>What nickname did I use to call you while roasting you?</div><input class="input" id="answer" autocomplete="off" placeholder="Type ur answer..."><button class="btn" onclick="check()">Unlock the bakchodi 🔓</button><div class="msg" id="msg">Hint: ye nickname sunke tu 2 sec ke liye offend hoti h 💀</div><div class="progress">1 question. Bas. Itna hi dimaag lagana hai 😭</div></main><script>const wrong=['Bruhhh 😭 itna toh yaad rakh!','Aalsi wali memory bhi Aalsi nikli 💀','Doctor sahiba, memory ka treatment kab start hoga? 😂','Wronggg. Snapchat pe friendship hui thi, calculator pe nhi 😭'];let n=0;function check(){const p=document.getElementById('paper'),a=document.getElementById('answer'),m=document.getElementById('msg');if(a.value.trim().toLowerCase()==='aalsi'){m.textContent='Finallyyy... kuch toh yaad h tujhe 😭❤️';m.style.background='#e7f8ea';setTimeout(()=>location.href='page2.html',900)}else{m.textContent=wrong[n++%wrong.length];p.classList.remove('wrong');void p.offsetWidth;p.classList.add('wrong');a.focus()}}document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
